name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Swift tests
        run: swift test --configuration release

      - name: Run core tests
        run: swift run --configuration release mergehawkcoretestrunner

      - name: Test release publication
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/release -v
