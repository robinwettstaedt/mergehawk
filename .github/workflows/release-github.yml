name: GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft:
        description: "Leave the build as a draft without offering an update"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Serialize automatic and manual publications to this one feed.
concurrency:
  group: public-download-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed installer
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    env:
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      NOTARYTOOL_PROFILE: mergehawk-notary

    steps:
      - name: Require protected main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "${GITHUB_REF_PROTECTED:-false}" != true ]]; then
            echo 'Public installers must be built from protected main.' >&2
            exit 2
          fi

      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve release versions
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/release-env.sh
          source scripts/lib/release-history.sh
          load_release_env_file scripts/release-github.env RELEASE_REPOSITORY SPARKLE_FEED_URL SPARKLE_PUBLIC_KEY
          build="$(date -u +%Y%m%d%H%M%S)"
          published_tags="$(list_published_release_tags "$RELEASE_REPOSITORY")"
          marketing_version="$(printf '%s\n' "$published_tags" | python3 scripts/lib/release-version.py)"
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Validate signing configuration
        shell: bash
        env:
          HAS_DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN != '' }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$HAS_DOWNLOADS_TOKEN" != true ]]; then
            echo 'Set DOWNLOADS_TOKEN with Contents write permission for mergehawk-downloads.' >&2
            exit 2
          fi
          for name in SPARKLE_PRIVATE_KEY DEVELOPER_ID_APPLICATION DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release configuration: $name" >&2
              exit 2
            fi
          done

      - name: Import signing certificate into temporary Keychain
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/mergehawk-release.keychain-db"
          certificate_path="$RUNNER_TEMP/mergehawk-developer-id.p12"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          rm "$certificate_path"
          echo "NOTARYTOOL_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --keychain "$NOTARYTOOL_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed and notarized installer with Sparkle updates
        shell: bash
        env:
          MARKETING_VERSION: ${{ steps.release.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          scripts/release-github.sh --version "v$MARKETING_VERSION" --build "$BUILD_NUMBER" --prepare-only

      - name: Reject stale source before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo 'Main advanced during this build. A newer workflow run will publish the current source.' >&2
            exit 2
          fi

      - name: Publish public download assets
        shell: bash
        env:
          # This credential can write only to mergehawk-downloads; source checkout is read-only.
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          MARKETING_VERSION: ${{ steps.release.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Set DOWNLOADS_TOKEN with Contents write permission for mergehawk-downloads}"
          args=(--version "v$MARKETING_VERSION" --build "$BUILD_NUMBER" --publish-only)
          if [[ "$DRAFT" == true ]]; then
            args+=(--draft)
          fi
          scripts/release-github.sh "${args[@]}"

      - name: Link release in run summary
        env:
          MARKETING_VERSION: ${{ steps.release.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.release.outputs.build }}
          DRAFT: ${{ inputs.draft }}
        run: |
          source scripts/lib/release-env.sh
          load_release_env_file scripts/release-github.env RELEASE_REPOSITORY SPARKLE_FEED_URL SPARKLE_PUBLIC_KEY
          {
            echo "[MergeHawk releases](https://github.com/$RELEASE_REPOSITORY/releases)"
            echo "Build: $MARKETING_VERSION ($BUILD_NUMBER)."
            echo
            echo "Apple Silicon, macOS 14+. Signed, notarized, and configured for Sparkle software updates."
            echo "Draft requested: ${DRAFT:-false}. Replace your old private installer manually once to enable updates."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/mergehawk-release.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/mergehawk-developer-id.p12"
