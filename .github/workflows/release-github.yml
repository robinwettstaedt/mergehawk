name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# One release at a time, and never cancel a run that may be publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed and notarized assets
    if: github.ref == 'refs/heads/main' && github.triggering_actor == github.repository_owner
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    env:
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      NOTARYTOOL_PROFILE: mergehawk-notary

    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve release version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          source scripts/lib/release-history.sh
          tags="$(list_published_release_tags "$GITHUB_REPOSITORY")"
          version="$(printf '%s\n' "$tags" | python3 scripts/lib/release-version.py "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate into temporary Keychain
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64:?Missing release secret DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64}"
          : "${DEVELOPER_ID_CERTIFICATE_PASSWORD:?Missing release secret DEVELOPER_ID_CERTIFICATE_PASSWORD}"
          keychain_path="$RUNNER_TEMP/mergehawk-release.keychain-db"
          certificate_path="$RUNNER_TEMP/mergehawk-developer-id.p12"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          rm "$certificate_path"
          echo "NOTARYTOOL_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing release secret APPLE_ID}"
          : "${APPLE_TEAM_ID:?Missing release secret APPLE_TEAM_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing release secret APPLE_APP_SPECIFIC_PASSWORD}"
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --keychain "$NOTARYTOOL_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed and notarized release assets
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Missing release secret SPARKLE_PRIVATE_KEY}"
          scripts/release-github.sh --version "v$VERSION" --build "$BUILD"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            .build/releases/v${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}/assets/MergeHawk-${{ steps.release.outputs.version }}-apple-silicon.dmg
            .build/releases/v${{ steps.release.outputs.version }}-${{ steps.release.outputs.build }}/assets/appcast.xml
          retention-days: 1
          if-no-files-found: error

      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/mergehawk-release.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/mergehawk-developer-id.p12"

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Main has moved since this build. Start a new release run." >&2
            exit 1
          fi
          existing_tags="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq '[.[] | select(.ref == "refs/tags/v'"$VERSION"'")] | length')"
          if [[ "$existing_tags" != 0 ]]; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi
          gh release create "v$VERSION" "release-assets/MergeHawk-$VERSION-apple-silicon.dmg" release-assets/appcast.xml \
            --target "$GITHUB_SHA" --title "MergeHawk $VERSION" --generate-notes --latest --fail-on-no-commits
