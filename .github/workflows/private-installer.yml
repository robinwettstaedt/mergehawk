name: Private Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Sign and notarize private installer
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    env:
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      NOTARYTOOL_PROFILE: mergehawk-notary
      MARKETING_VERSION: 0.1.0

    steps:
      - name: Require protected main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "${GITHUB_REF_PROTECTED:-false}" != true ]]; then
            echo 'Private installers must be built from protected main.' >&2
            exit 2
          fi

      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate signing configuration
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_APPLICATION DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release configuration: $name" >&2
              exit 2
            fi
          done

      - name: Import signing certificate into temporary Keychain
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/mergehawk-private-installer.keychain-db"
          certificate_path="$RUNNER_TEMP/mergehawk-developer-id.p12"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          rm "$certificate_path"
          echo "NOTARYTOOL_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --keychain "$NOTARYTOOL_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build signed and notarized DMG with updates disabled
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          scripts/build-private-installer.sh
          echo "directory=dist/private-installers/$MARKETING_VERSION-$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload private installer
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MergeHawk-${{ env.MARKETING_VERSION }}-${{ steps.package.outputs.build }}-apple-silicon
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Link installer in run summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "[Download the private MergeHawk installer]($ARTIFACT_URL)"
            echo
            echo "Built from commit $GITHUB_SHA. Apple Silicon, macOS 14+. Automatic updates disabled."
            echo 'Quit MergeHawk, open the DMG, and replace the app in Applications.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing credentials
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/mergehawk-private-installer.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/mergehawk-developer-id.p12"
