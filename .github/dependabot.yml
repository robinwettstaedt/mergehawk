version: 2
updates:
  # Workflows pin actions to full commit SHAs. Dependabot updates the SHA and its version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Package.swift and Package.resolved, including Sparkle, which ships inside the app.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      swift-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
